<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #0d1210;
      }
      .card {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 60px 64px 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #0d1210;
        font-family: "JetBrains Mono", monospace;
      }
      p {
        margin: 0;
        font-size: 34px;
        color: #8fa097;
      }
      h1 {
        margin: 0;
        font-size: 196px;
        line-height: 0.94;
        font-weight: 800;
        letter-spacing: -0.06em;
        color: #ffffff;
      }
      .cursor {
        display: inline-block;
        width: 84px;
        height: 146px;
        margin-left: 12px;
        background: #6ee7a8;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 34px;
        color: #8fa097;
      }
      .role {
        color: #6ee7a8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p>daniel@cayman:~$ whoami</p>
      <h1>daniel<br />cimring<span class="cursor"></span></h1>
      <div class="foot">
        <span class="role">builder • founder</span>
        <span>danielcimring.com</span>
      </div>
    </div>
  </body>
</html>
